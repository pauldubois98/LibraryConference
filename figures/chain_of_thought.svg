<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760">
<rect x="100" y="20" width="1400" height="130" rx="18" fill="#eef1f6"   opacity="1"/>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#1f2a44" font-weight="normal" text-anchor="middle" dominant-baseline="central" style=""><tspan x="800.0" y="63.8">3 étages × 12 rayonnages × 40 livres. 15 % sont prêtés.</tspan><tspan x="800.0" y="106.2">Combien de livres restent en rayon ?</tspan></text>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#c0392b" font-weight="bold" text-anchor="middle" dominant-baseline="central" style=""><tspan x="380" y="210.0">Réponse directe</tspan></text>
<line x1="380" y1="240" x2="380.0" y2="314.0" stroke="#6b7489" stroke-width="5" stroke-linecap="round"  opacity="1"/>
<polygon points="380,330 371.3,312.0 388.7,312.0" fill="#6b7489" opacity="1"/>
<rect x="200.0" y="340.0" width="360" height="120" rx="18" fill="#f7dcd8" stroke="#c0392b" stroke-width="3"  opacity="1"/>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="40" fill="#1f2a44" font-weight="bold" text-anchor="middle" dominant-baseline="central" style=""><tspan x="380.0" y="400.0">« 1 260 »  ✗</tspan></text>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="34" fill="#2e8b57" font-weight="bold" text-anchor="middle" dominant-baseline="central" style=""><tspan x="1120" y="210.0">Avec étapes intermédiaires</tspan></text>
<rect x="860.0" y="249.0" width="520" height="72" rx="18" fill="#d9f0e3"   opacity="1"/>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#1f2a44" font-weight="normal" text-anchor="middle" dominant-baseline="central" style=""><tspan x="1120.0" y="285.0">3 × 12 = 36 rayonnages</tspan></text>
<line x1="1120" y1="322" x2="1120.0" y2="333.8" stroke="#6b7489" stroke-width="4" stroke-linecap="round"  opacity="1"/>
<polygon points="1120,345 1113.9,332.4 1126.1,332.4" fill="#6b7489" opacity="1"/>
<rect x="860.0" y="344.0" width="520" height="72" rx="18" fill="#d9f0e3"   opacity="1"/>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#1f2a44" font-weight="normal" text-anchor="middle" dominant-baseline="central" style=""><tspan x="1120.0" y="380.0">36 × 40 = 1 440 livres</tspan></text>
<line x1="1120" y1="417" x2="1120.0" y2="428.8" stroke="#6b7489" stroke-width="4" stroke-linecap="round"  opacity="1"/>
<polygon points="1120,440 1113.9,427.4 1126.1,427.4" fill="#6b7489" opacity="1"/>
<rect x="860.0" y="439.0" width="520" height="72" rx="18" fill="#d9f0e3"   opacity="1"/>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#1f2a44" font-weight="normal" text-anchor="middle" dominant-baseline="central" style=""><tspan x="1120.0" y="475.0">15 % de 1 440 = 216</tspan></text>
<line x1="1120" y1="512" x2="1120.0" y2="523.8" stroke="#6b7489" stroke-width="4" stroke-linecap="round"  opacity="1"/>
<polygon points="1120,535 1113.9,522.4 1126.1,522.4" fill="#6b7489" opacity="1"/>
<rect x="860.0" y="534.0" width="520" height="72" rx="18" fill="#2e8b57"   opacity="1"/>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="bold" text-anchor="middle" dominant-baseline="central" style=""><tspan x="1120.0" y="570.0">1 440 − 216 = 1 224</tspan></text>
<text font-family="Lato, 'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="32" fill="#0f7c8c" font-weight="normal" text-anchor="middle" dominant-baseline="central" style="font-style:italic;"><tspan x="800" y="690.0">Chaque étape écrite devient du contexte pour prédire la suivante.</tspan></text>
</svg>
